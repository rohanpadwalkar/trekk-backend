version: "3.9"

# Fully offline dev loop — local Mongo/Redis/MinIO instead of external
# accounts. Run alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# This overrides the backend's Mongo/Redis/S3 env vars to point at the
# local containers below, regardless of what .env has (so it's safe to use
# even once .env is filled in with your real external credentials).
services:
  backend:
    environment:
      - MONGO_URI=mongodb://trekk:trekk_dev_password@mongo:27017/trekk_together?authSource=admin&replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=trekk_minio_admin
      - S3_SECRET_ACCESS_KEY=trekk_minio_dev_password
      - S3_FORCE_PATH_STYLE=true
      - S3_PUBLIC_URL=http://localhost:9000
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Single-node replica set, not a plain standalone — Mongoose/Mongo
  # multi-document transactions (used for atomic seat booking, see
  # bookings.service.ts) require a replica set even with just one member.
  mongo:
    image: mongo:7
    container_name: trekk-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=trekk
      - MONGO_INITDB_ROOT_PASSWORD=trekk_dev_password
      - MONGO_INITDB_DATABASE=trekk_together
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: initiates the rs0 replica set on first boot.
  mongo-init:
    image: mongo:7
    container_name: trekk-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo -u trekk -p trekk_dev_password --authenticationDatabase admin --eval
      "try { rs.status(); print('replica set already initiated'); } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); print('replica set initiated'); }"

  redis:
    image: redis:7-alpine
    container_name: trekk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: trekk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=trekk_minio_admin
      - MINIO_ROOT_PASSWORD=trekk_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the 5 buckets this app needs and sets public-read
  # policy on the 4 that serve images/attachments directly. kyc-documents
  # is deliberately left private — served only via signed GET URLs.
  createbuckets:
    image: minio/mc:latest
    container_name: trekk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 trekk_minio_admin trekk_minio_dev_password;
      mc mb --ignore-existing local/avatars;
      mc mb --ignore-existing local/trek-images;
      mc mb --ignore-existing local/post-images;
      mc mb --ignore-existing local/chat-attachments;
      mc mb --ignore-existing local/kyc-documents;
      mc anonymous set download local/avatars;
      mc anonymous set download local/trek-images;
      mc anonymous set download local/post-images;
      mc anonymous set download local/chat-attachments;
      mc anonymous set none local/kyc-documents;
      exit 0;
      "

volumes:
  mongo-data:
  redis-data:
  minio-data:
